# Configuration B — the setup docs.mergify.com/merge-protections/setup describes:
# the repository states its review requirement once, Mergify evaluates it, and the
# `Mergify Merge Protections` check is marked Required in the GitHub ruleset.
#
# There are NO pull_request_rules in this file. There is no `review` action. Nothing
# here is capable of creating an approving review.
merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: reviewed-everywhere
    if: true
    success_conditions:
      - or:
          - base != main
          - "#approved-reviews-by >= 1"
      - check-success = ci
