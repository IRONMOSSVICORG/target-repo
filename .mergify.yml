# Configuration B — the architecture docs.mergify.com/merge-protections/setup describes:
# state the review requirement once in Mergify, and mark the `Mergify Merge Protections`
# check Required in the GitHub ruleset so GitHub enforces it.
#
# NO pull_request_rules. NO review action. Nothing here can create an approving review.
merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: reviewed-everywhere
    if: true
    success_conditions:
      - or:
          - base != main
          - "#approved-reviews-by >= 1"
      - check-success = ci
