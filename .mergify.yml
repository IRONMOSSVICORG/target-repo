# Rebuttal arm. There is NO `review` action anywhere in this file. Nothing here can
# create an approving review. The only difference from the case configuration is
# that the `automatic approval` rule has been deleted outright.
merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: require-review-and-ci
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci

  - name: green-on-release
    if:
      - base = release
    success_conditions:
      - check-success = ci

pull_request_rules:
  - name: copy release work to the maintenance branch
    conditions:
      - base = release
      - check-success = ci
    actions:
      copy:
        branches:
          - maintenance
